# ASP.NET
# Build and test ASP.NET projects.
# Add steps that publish symbols, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/apps/aspnet/build-aspnet-4

trigger:
- master

schedules:
- cron: '0 6 * * Mon-Fri'

  branches:
    include:
    - master
    
pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

steps:
- task: NuGetToolInstaller@1

- task: NuGetCommand@2
  inputs:
    restoreSolution: '$(solution)'

- task: VSBuild@1
  inputs:
    solution: '$(solution)'
    msbuildArgs: '/p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:SkipInvalidConfigurations=true /p:PackageLocation="$(build.artifactStagingDirectory)"'
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'

- task: VSTest@2
  inputs:
    platform: '$(buildPlatform)'
    configuration: '$(buildConfiguration)'
    testAssemblyVer2: '**\$(BuildConfiguration)\**\Selenium_Demo.dll'
    testFiltercriteria: 'TestCategory=Amazon1'
    #testFiltercriteria: 'TestCategory=Handling Multiple Windows'
    rerunFailedTests: true
    #rerunMaxAttempts: 2
    
- task: CopyFiles@2
  condition: always()
  inputs:
    SourceFolder: '$(Agent.TempDirectory)/TestResults'
    Contents: '**/*.*'
    TargetFolder: '$(Build.ArtifactStagingDirectory)/TestResults'
    OverWrite: true

- task: CmdLine@2
  condition: always()
  displayName: 'Convert TRX to HTML'
  inputs:
    script: 'trx-to-html -i $(Agent.TempDirectory)/TestResults/**/*.trx -o $(Build.ArtifactStagingDirectory)/TestResults/TestReport.html'
    workingDirectory: '$(Agent.TempDirectory)'

- task: PublishBuildArtifacts@1
  condition: always()
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)
    artifactName: AmazonTestResults
    
    
- task: PublishBuildArtifacts@1
  condition: always()
  inputs:
    pathToPublish: $(Build.ArtifactStagingDirectory)
    artifactName: html-report
    